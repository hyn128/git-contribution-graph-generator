name: Deploy GitHub contribution data

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-contributions.yml"
      - "scripts/generate_github_contributions.rb"
      - "public/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Generate contribution data
        env:
          GH_USERNAME: ${{ vars.GH_USERNAME || github.repository_owner }}
          GITHUB_GRAPHQL_TOKEN: ${{ secrets.GH_CONTRIBUTION || github.token }}
        run: ruby scripts/generate_github_contributions.rb

      - name: Verify contribution data
        run: |
          ruby -rjson -e '
            path = "public/github-contributions.json"
            data = JSON.parse(File.read(path))
            abort "invalid schemaVersion" unless data["schemaVersion"] == 1
            abort "missing login" if data["login"].to_s.empty?
            abort "missing weeks" unless data["weeks"].is_a?(Array) && !data["weeks"].empty?
            abort "missing contribution days" unless data["weeks"].any? { |week| week["contributionDays"].is_a?(Array) && !week["contributionDays"].empty? }
            forbidden = %w[token accessToken authorization secret]
            leaked = forbidden.any? { |key| data.key?(key) }
            abort "sensitive field detected" if leaked
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
